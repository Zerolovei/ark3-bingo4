<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>第4回ARK3ビンゴ！Ⅳ</title>

<style>

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
  min-height: 100%;
}

body {
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;

  text-align: center;
  color: #333;

  background-image: url("bac.png");
  background-size: 100% auto;
  background-position: center top;
  background-repeat: no-repeat;
  background-color: #171142;

  min-height: 100vh;

  padding:
    max(6px, env(safe-area-inset-top))
    2px
    max(20px, env(safe-area-inset-bottom));
}


/* =========================
   タイトル
========================= */

h1 {
  margin: 5px 0 5px;

  font-size: clamp(19px, 5vw, 30px);
  font-weight: 900;

  color: white;

  text-shadow:
    0 3px 5px rgba(0,0,0,.95),
    0 0 12px rgba(0,0,0,.75);
}


/* =========================
   カード再生成
========================= */

.controls {
  display: flex;
  justify-content: center;
  align-items: center;

  margin: 4px auto;
}

button {
  border: none;
  border-radius: 999px;

  padding: 10px 18px;

  font-size: 13px;
  font-weight: bold;

  color: white;

  cursor: pointer;

  background:
    linear-gradient(
      135deg,
      #ff4fa3,
      #9567ff
    );

  box-shadow:
    0 4px 10px rgba(0,0,0,.35);
}

button:active {
  transform: scale(.94);
}


/* =========================
   検索プルダウン
========================= */

.search-area {
  display: flex;
  justify-content: center;
  align-items: center;

  gap: 5px;

  margin: 4px auto 0;

  color: white;

  font-size: 12px;
  font-weight: bold;

  text-shadow:
    0 2px 4px rgba(0,0,0,.9);
}

#panelSearch {
  max-width: 200px;

  padding: 7px 8px;

  border:
    2px solid rgba(255,255,255,.85);

  border-radius: 10px;

  background:
    rgba(255,255,255,.95);

  color: #222;

  font-size: 12px;
  font-weight: bold;
}


/* =========================
   BINGO表示
========================= */

#bingo {
  min-height: 38px;

  display: flex;
  justify-content: center;
  align-items: center;

  margin: 0 auto;

  font-size:
    clamp(22px, 6vw, 36px);

  font-weight: 900;

  color: white;

  text-shadow:
    0 3px 5px rgba(0,0,0,.95),
    0 0 12px rgba(255,0,100,.9);
}


/* =========================
   9×9盤面
========================= */

#board {
  display: grid;

  grid-template-columns:
    repeat(9, minmax(0, 1fr));

  gap: 2px;

  width:
    min(99vw, 720px);

  /*
    ★今回変更
    以前の1マス分の余白を削除
    → 盤面を1マス分上へ
  */
  margin:
    0
    auto
    0;

  padding: 4px;

  border-radius: 14px;

  background:
    rgba(67,22,77,.48);

  box-shadow:
    0 5px 20px rgba(0,0,0,.5);

  backdrop-filter:
    blur(1.5px);
}


/* =========================
   通常マス
========================= */

.cell {
  aspect-ratio: 1 / 1;

  min-width: 0;

  display: flex;
  justify-content: center;
  align-items: center;

  text-align: center;

  padding: 1px;

  border-radius: 5px;

  background:
    rgba(255,255,255,.82);

  border:
    1px solid rgba(255,255,255,.9);

  font-size:
    clamp(6.5px, 1.75vw, 11px);

  font-weight: 700;

  line-height: 1.08;

  overflow-wrap: anywhere;

  user-select: none;
  cursor: pointer;

  box-shadow:
    inset 0 0 4px rgba(255,255,255,.8);

  transition:
    transform .12s ease,
    background .18s ease,
    color .18s ease,
    box-shadow .18s ease;
}

.cell:active {
  transform: scale(.92);
}


/* =========================
   緑：達成済み
========================= */

.cell.checked {
  background:
    rgba(48,190,95,.94);

  color: white;

  text-shadow:
    0 1px 3px rgba(0,0,0,.65);
}


/* =========================
   黄色：最後に押した
========================= */

.cell.last {
  background:
    rgba(255,214,38,.97);

  color: #222;

  text-shadow: none;

  box-shadow:
    inset 0 0 0 2px rgba(255,255,255,.55),
    0 0 9px rgba(255,220,0,.8);
}


/* =========================
   紫：リーチ
========================= */

.cell.reach {
  background:
    rgba(157,92,255,.96);

  color: white;

  text-shadow:
    0 1px 3px rgba(0,0,0,.65);

  box-shadow:
    inset 0 0 0 2px rgba(255,255,255,.4),
    0 0 9px rgba(157,92,255,.8);
}


/* =========================
   ピンク：BINGO
========================= */

.cell.bingo-cell {
  background:
    rgba(255,61,155,.97);

  color: white;

  text-shadow:
    0 1px 3px rgba(0,0,0,.7);

  box-shadow:
    inset 0 0 0 2px rgba(255,255,255,.45),
    0 0 10px rgba(255,40,145,.85);
}


/* =========================
   FREE
========================= */

.cell.free {
  background:
    linear-gradient(
      135deg,
      rgba(67,198,255,.97),
      rgba(157,105,255,.97)
    );

  color: white;

  font-weight: 900;

  text-shadow:
    0 2px 3px rgba(0,0,0,.45);
}

.cell.free.bingo-cell {
  background:
    rgba(255,61,155,.97);
}


/* =========================
   検索ヒット
   元の色＋青発光
========================= */

.cell.search-hit {
  position: relative;

  outline:
    3px solid #27c8ff;

  outline-offset:
    -3px;

  box-shadow:
    inset 0 0 0 2px #ffffff,
    0 0 10px #21c8ff,
    0 0 20px #21c8ff,
    0 0 30px rgba(33,200,255,.95);

  z-index: 3;

  animation:
    searchGlow
    1s
    ease-in-out
    infinite
    alternate;
}

@keyframes searchGlow {

  from {
    filter: brightness(1);
  }

  to {
    filter: brightness(1.35);
  }

}


/* =========================
   スマホ
========================= */

@media (max-width: 600px) {

  body {
    background-size:
      100% auto;

    background-position:
      center top;

    background-repeat:
      no-repeat;

    background-attachment:
      scroll;
  }

  h1 {
    font-size: 19px;
  }

  button {
    padding:

  }

  #panelSearch {

      185px;

    font-size:
      11px;
  }

  #bingo {
    min-height:

  }

  #board {
    width:

      ★ここも変更
      11vw → 0
    */
    margin-top:
      0;

    gap:
      2px;

    padding:
      3px;
  }

  .cell {
    font-size:
      6.7px;

    border-radius:
      4px;
  }

}

</style>

/* ==================================================
   スタッフ
   最低1枚保証
   複数OK
================================================== */

const staffItems = [

  "野田さん！",
  "金子さん！",
  "矢田部さん！"

];


/* ==================================================
   ステーション
   各最大1枚
================================================== */

const stationItems = [

  "五反田",
  "新橋",
  "麻布十番",
  "南青山",
  "三軒茶屋",
  "自由が丘",
  "北千束",
  "大森"

];


/* ==================================================
   残り50枚用
================================================== */

const fullPool = [

  ...areaItems,
  ...normalItems,
  ...staffItems,
  ...stationItems

];


/* ==================================================
   保存キー
================================================== */

const BOARD_KEY =
  "ark3_bingo_fourth_9x9_board_v1";

const CHECK_KEY =
  "ark3_bingo_fourth_9x9_checks_v1";

const LAST_KEY =
  "ark3_bingo_fourth_9x9_last_v1";


/* ==================================================
   BINGOライン
   横9 + 縦9 + 斜め2 = 20
================================================== */

const lines = [];


/* 横 */

for (
  let r = 0;
  r < 9;
  r++
) {

  const line = [];

  for (
    let c = 0;
    c < 9;
    c++
  ) {

    line.push(
      r * 9 + c
    );

  }

  lines.push(line);

}


/* 縦 */

for (
  let c = 0;
  c < 9;
  c++
) {

  const line = [];

  for (
    let r = 0;
    r < 9;
    r++
  ) {

    line.push(
      r * 9 + c
    );

  }

  lines.push(line);

}


/* 左上 → 右下 */

lines.push([
  0,10,20,30,40,50,60,70,80
]);


/* 右上 → 左下 */

lines.push([
  8,16,24,32,40,48,56,64,72
]);


/* ==================================================
   ランダム
================================================== */

function randomFrom(array) {

  return array[
    Math.floor(
      Math.random() *
      array.length
    )
  ];

}


/* ==================================================
   シャッフル
================================================== */

function shuffle(array) {

  for (
    let i = array.length - 1;
    i > 0;
    i--
  ) {

    const j =
      Math.floor(
        Math.random() *
        (i + 1)
      );

    [
      array[i],
      array[j]
    ] = [
      array[j],
      array[i]
    ];

  }

  return array;

}


/* ==================================================
   新規カード
================================================== */

function generateNewBoard() {

  const selected = [];


  /* エリア30枚保証 */

  for (
    let i = 0;
    i < 30;
    i++
  ) {

    selected.push(
      randomFrom(
        areaItems
      )
    );

  }


  /* 残り50枚 */

  const usedStations =
    new Set();


  while (
    selected.length < 80
  ) {

    const picked =
      randomFrom(
        fullPool
      );


    /*
      ステーションは
      同じものを2枚入れない
    */

    if (
      stationItems.includes(
        picked
      )
    ) {

      if (
        usedStations.has(
          picked
        )
      ) {

        continue;

      }


      usedStations.add(
        picked
      );

    }


    selected.push(
      picked
    );

  }


  /* スタッフ最低1枚保証 */

  const hasStaff =
    selected.some(
      item =>
        staffItems.includes(
          item
        )
    );


  if (
    !hasStaff
  ) {

    const replaceIndex =
      30 +
      Math.floor(
        Math.random() * 50
      );


    selected[replaceIndex] =
      randomFrom(
        staffItems
      );

  }


  /* 全80枚シャッフル */

  shuffle(
    selected
  );


  /* 中央FREE */

  selected.splice(
    40,
    0,
    "FREE"
  );


  const checked =
    new Array(81)
      .fill(false);


  checked[40] =
    true;


  localStorage.setItem(
    BOARD_KEY,
    JSON.stringify(
      selected
    )
  );


  localStorage.setItem(
    CHECK_KEY,
    JSON.stringify(
      checked
    )
  );


  localStorage.removeItem(
    LAST_KEY
  );


  renderBoard(
    selected,
    checked,
    null
  );

}


/* ==================================================
   盤面表示
================================================== */

function renderBoard(
  boardData,
  checkedData,
  lastIndex
) {

  const board =
    document.getElementById(
      "board"
    );


  board.innerHTML =
    "";


  boardData.forEach(
    (item, index) => {


      const cell =
        document.createElement(
          "div"
        );


      cell.classList.add(
        "cell"
      );


      cell.dataset.index =
        index;


      cell.dataset.item =
        item;


      /* FREE */

      if (
        index === 40
      ) {

        cell.textContent =
          "FREE";


        cell.classList.add(
          "free",
          "checked"
        );

      }


      /* オートロック */

      else if (
        item ===
        "オートロック２個以上"
      ) {

        cell.innerHTML =
          "オートロック<br>２個以上";

      }


      /* 通常 */

      else {

        cell.textContent =
          item;

      }


      /* FREE以外クリック */

      if (
        index !== 40
      ) {

        cell.addEventListener(
          "click",
          function () {

            toggleCell(
              index
            );

          }
        );

      }


      board.appendChild(
        cell
      );

    }
  );


  updateColors(
    checkedData,
    lastIndex
  );


  highlightSearch();

}


/* ==================================================
   マスクリック
================================================== */

function toggleCell(index) {

  const checked =
    getChecked();


  if (
    checked[index]
  ) {

    checked[index] =
      false;


    if (
      getLastIndex() ===
      index
    ) {

      localStorage.removeItem(
        LAST_KEY
      );

    }

  }

  else {

    checked[index] =
      true;


    localStorage.setItem(
      LAST_KEY,
      String(index)
    );

  }


  checked[40] =
    true;


  localStorage.setItem(
    CHECK_KEY,
    JSON.stringify(
      checked
    )
  );


  updateColors(
    checked,
    getLastIndex()
  );


  highlightSearch();

}


/* ==================================================
   チェック取得
================================================== */

function getChecked() {

  let checked;


  try {

    checked =
      JSON.parse(
        localStorage.getItem(
          CHECK_KEY
        )
      );

  }

  catch (e) {

    checked =
      null;

  }


  if (
    !Array.isArray(
      checked
    ) ||
    checked.length !== 81
  ) {

    checked =
      new Array(81)
        .fill(false);

  }


  checked[40] =
    true;


  return checked;

}


/* ==================================================
   最後に押したマス
================================================== */

function getLastIndex() {

  const value =
    localStorage.getItem(
      LAST_KEY
    );


  if (
    value === null
  ) {

    return null;

  }


  const number =
    Number(value);


  if (
    Number.isInteger(
      number
    ) &&
    number >= 0 &&
    number < 81
  ) {

    return number;

  }


  return null;

}


/* ==================================================
   色判定
================================================== */

function updateColors(
  checked,
  lastIndex
) {

  const cells =
    [
      ...document.querySelectorAll(
        ".cell"
      )
    ];


  /* 色リセット */

  cells.forEach(
    (cell, index) => {


      cell.classList.remove(
        "checked",
        "last",
        "reach",
        "bingo-cell"
      );


      if (
        index === 40
      ) {

        cell.classList.add(
          "free",
          "checked"
        );

      }

      else if (
        checked[index]
      ) {

        cell.classList.add(
          "checked"
        );

      }

    }
  );


  /* 完成ライン */

  const completedLines =
    lines.filter(
      line =>
        line.every(
          index =>
            checked[index]
        )
    );


  const bingoCells =
    new Set();


  completedLines.forEach(
    line => {

      line.forEach(
        index =>
          bingoCells.add(
            index
          )
      );

    }
  );


  /* リーチ */

  const reachCells =
    new Set();


  lines.forEach(
    line => {


      const missing =
        line.filter(
          index =>
            !checked[index]
        );


      if (
        missing.length === 1
      ) {

        reachCells.add(
          missing[0]
        );

      }

    }
  );


  /* 黄色 */

  if (
    lastIndex !== null &&
    checked[lastIndex] &&
    !bingoCells.has(
      lastIndex
    )
  ) {

    cells[lastIndex]
      .classList
      .add(
        "last"
      );

  }


  /* 紫 */

  reachCells.forEach(
    index => {

      if (
        !checked[index] &&
        !bingoCells.has(
          index
        )
      ) {

        cells[index]
          .classList
          .add(
            "reach"
          );

      }

    }
  );


  /* ピンク */

  bingoCells.forEach(
    index => {


      cells[index]
        .classList
        .remove(
          "last",
          "reach"
        );


      cells[index]
        .classList
        .add(
          "bingo-cell"
        );

    }
  );


  updateBingoText(
    completedLines.length,
    checked
  );

}


/* ==================================================
   BINGO表示
================================================== */

function updateBingoText(
  bingoCount,
  checked
) {

  const display =
    document.getElementById(
      "bingo"
    );


  if (
    checked.every(
      Boolean
    )
  ) {

    display.textContent =
      "🎉 ALL BINGO!! 🎉";

  }

  else if (
    bingoCount === 0
  ) {

    display.textContent =
      "";

  }

  else if (
    bingoCount === 1
  ) {

    display.textContent =
      "🎉 BINGO! 🎉";

  }

  else {

    display.textContent =
      "🎉 " +
      bingoCount +
      " LINE! 🎉";

  }

}

/* ==================================================
   検索ハイライト
================================================== */

function highlightSearch() {

  const select =
    document.getElementById(
      "panelSearch"
    );


  const target =
    select.value;


  const cells =
    document.querySelectorAll(
      ".cell"
    );


  /* 一度解除 */

  cells.forEach(
    cell => {

      cell.classList.remove(
        "search-hit"
      );

    }
  );


  if (
    target === ""
  ) {

    return;

  }


  /* 同じ項目を全部青発光 */

  cells.forEach(
    cell => {


      if (
        cell.dataset.item ===
        target
      ) {

        cell.classList.add(
          "search-hit"
        );

      }

    }
  );

}


/* ==================================================
   保存カード読込
================================================== */

function loadBoard() {

  let boardData;
  let checkedData;


  try {

    boardData =
      JSON.parse(
        localStorage.getItem(
          BOARD_KEY
        )
      );


    checkedData =
      JSON.parse(
        localStorage.getItem(
          CHECK_KEY
        )
      );

  }

  catch (e) {

    boardData =
      null;

    checkedData =
      null;

  }


  if (

    Array.isArray(
      boardData
    ) &&

    boardData.length === 81 &&

    Array.isArray(
      checkedData
    ) &&

    checkedData.length === 81

  ) {


    checkedData[40] =
      true;


    renderBoard(
      boardData,
      checkedData,
      getLastIndex()
    );

  }

  else {

    generateNewBoard();

  }

}

buildSearchMenu();
